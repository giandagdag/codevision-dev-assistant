<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeVision Developer Assistant: Concept Demo</title>
<!-- Self-contained: no internet, fonts, or external files needed. Open in Edge or Chrome. -->
<style>
:root{
  --navy:#1E2B45; --blue:#1F6FE0; --blue-d:#1757B8; --blue-l:#EAF1FD; --blue-ll:#F4F8FE;
  --ink:#2B3445; --muted:#6B7385; --line:#E3E7EE; --canvas:#F6F8FB; --white:#fff;
  --green:#157F3B; --green-l:#E7F5EC; --amber:#9A5B00; --amber-l:#FFF3DF;
  --red:#B42318; --red-l:#FDECEA; --violet:#5B4BC4; --violet-l:#EFEDFC;
  --radius:10px;
  --font:"Segoe UI", "Segoe UI Variable", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono:Consolas, "Cascadia Mono", "Courier New", monospace;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji";
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font),var(--emoji);color:var(--ink);background:var(--canvas);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---------- App frame (mirrors CodeVision: icon rail + light canvas) ---------- */
.app{display:grid;grid-template-columns:86px 1fr;min-height:100vh}
.rail{background:var(--white);border-right:1px solid var(--line);padding-top:74px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ri{width:72px;padding:10px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#7A8294;font-size:12px;text-align:center;line-height:1.2}
.ri svg{width:24px;height:24px}
.ri.active{background:var(--blue-l);color:var(--blue)}
.ri.active span{font-weight:600}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:33px}
.wordmark{font-weight:800;letter-spacing:.06em;color:var(--navy);font-size:19px}
.brand .sep{width:1px;height:24px;background:var(--line)}
.brand .prod{color:var(--muted);font-size:15px}
.user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700}

/* ---------- Stepper ---------- */
.stepper{background:var(--white);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;gap:6px;align-items:center;min-height:62px}
.stepper.hide{display:none}
.st{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.st .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--canvas);border:1px solid var(--line);font-size:15px}
.st .n{font-weight:600;margin-right:2px}
.st.done{color:var(--green)}
.st.done .dot{background:var(--green-l);border-color:#BFE3CB}
.st.cur{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.st.cur .dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px #CFE0FB}
.st.skip{opacity:.45;text-decoration:line-through}
.arrow{color:#B7BECB;font-size:12px}
.path-tag{margin-right:10px;padding:4px 10px;border-radius:6px;background:var(--violet-l);color:var(--violet);font-weight:600;font-size:13px}

/* ---------- Stage ---------- */
.stage{padding:22px 28px 96px;max-width:1400px;width:100%}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}
.shead h1{font-size:23px;margin:0;color:var(--navy);font-weight:700;letter-spacing:-.01em}
.shead .sub{margin:3px 0 0;color:var(--muted);max-width:72ch}
.sright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rid{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--white);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.env{font-size:12.5px;font-weight:600;color:var(--violet);background:var(--violet-l);border:1px dashed #B9B0EE;padding:4px 9px;border-radius:6px}
.illus{margin-top:14px;font-size:12px;color:#9098A8}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-grey{background:#EEF0F4;color:#5A6273}
.p-blue{background:var(--blue-l);color:var(--blue-d)}
.p-amber{background:var(--amber-l);color:var(--amber)}
.p-violet{background:var(--violet-l);color:var(--violet)}
.p-green{background:var(--green-l);color:var(--green)}
.p-red{background:var(--red-l);color:var(--red)}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px 20px}
.h3{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{border:1px solid var(--blue);color:var(--blue);background:var(--white);padding:8px 16px;border-radius:6px;font-weight:600}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.sel{box-shadow:0 0 0 3px #CFE0FB}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:600}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{padding:3px 0}
ol.flow{margin:0;padding-left:22px}
ol.flow li{padding:2px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--green-l);color:var(--green);margin-left:6px}
.tag.b{background:var(--blue-l);color:var(--blue-d)}

/* ---------- Motion ---------- */
.appear{animation:appear .35s ease-out both}
.d1{animation-delay:.55s}.d2{animation-delay:.9s}.d3{animation-delay:1.25s}.d4{animation-delay:1.6s}
.d5{animation-delay:1.95s}.d6{animation-delay:2.3s}.d7{animation-delay:2.65s}.d8{animation-delay:3s}.d9{animation-delay:3.35s}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fresh{animation:fresh 2.4s ease-out both}
@keyframes fresh{0%{background:#FFF1C2}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Home ---------- */
.hero{text-align:center;padding:26px 0 18px}
.hero svg{width:92px;height:69px}
.hero h2{margin:8px 0 2px;font-size:26px;color:var(--navy)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:14px auto 22px}
.entry .card{padding:22px;text-align:left;border-width:1.5px}
.entry .card:hover{border-color:var(--blue)}
.entry .ic{font-size:28px}
.entry h3{margin:8px 0 4px;color:var(--navy);font-size:18px}
.entry.focus-a .a,.entry.focus-b .b{border-color:var(--blue);box-shadow:0 0 0 4px #D9E6FC}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}

/* ---------- Phase 1: chat + live panel ---------- */
.p1{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;height:calc(100vh - 280px);min-height:470px}
.chat{display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;color:var(--navy)}
.lock{font-size:12.5px;font-weight:600;color:var(--amber);background:var(--amber-l);padding:3px 10px;border-radius:999px}
.chat-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:88%}
.msg.dev{align-self:flex-end;flex-direction:row-reverse}
.msg .av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue-l)}
.msg .av svg{width:24px;height:18px}
.msg.dev .av{background:#E9ECF2;color:#4B5468;font-weight:700;font-size:13px}
.bubble{padding:10px 14px;border-radius:12px;background:var(--canvas);border:1px solid var(--line)}
.msg.dev .bubble{background:var(--blue);color:#fff;border-color:var(--blue);border-top-right-radius:3px}
.msg.ai .bubble{border-top-left-radius:3px}
.q{display:block;font-weight:700;color:var(--navy);margin-top:4px}
.decide{margin-top:10px;border:1px solid #F2D199;background:var(--amber-l);border-radius:8px;padding:10px 12px}
.decide .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.fake-input{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:#9AA1B0;font-size:14px}
.send{width:42px;border:0;border-radius:6px;background:var(--blue);color:#fff}
.panel{overflow:auto;min-height:0;scroll-behavior:smooth}
.ph{position:sticky;top:0;background:var(--white);z-index:2;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt{font-weight:700;color:var(--navy)}
.prog{margin-top:10px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.segs span{height:6px;border-radius:3px;background:#E6E9EF}
.segs span.on{background:var(--blue)}
.segs.warn span.on{background:#E3A23B}
.ptxt{font-size:12.5px;color:var(--muted);margin-top:4px}
.psec{padding:12px 16px;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0}
.psec h4{margin:0 0 6px;font-size:13px;color:var(--navy)}
.f{padding:4px 6px;margin:0 -6px;border-radius:6px}
.fl{font-size:12px;color:var(--muted);font-weight:600}
.fv{font-size:14px}
.fv.empty{color:#A8AFBC;font-style:italic;font-size:13px}
.yaml{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.45;margin:10px 0 0;white-space:pre;overflow:auto;color:var(--ink)}
.yaml .k{color:var(--blue-d)}

/* ---------- Discovery / gates / lanes / review ---------- */
.search-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.search-row:last-child{border-bottom:0}
.search-row .ic{font-size:20px;width:30px;text-align:center}
.search-row .grow{flex:1}
.ok{color:var(--green);font-weight:600;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;font-weight:600}
.banner.g{background:var(--green-l);color:var(--green);border:1px solid #BFE3CB}
.banner.a{background:var(--amber-l);color:var(--amber);border:1px solid #F2D199}
.banner.r{background:var(--red-l);color:var(--red);border:1px solid #F4C7C2}
.banner.b{background:var(--blue-l);color:var(--blue-d);border:1px solid #CADCF8}
.banner.v{background:var(--violet-l);color:var(--violet);border:1px solid #D4CEF5}
.banner .grow{flex:1;font-weight:500}
.find{padding:14px 16px}
.find .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.find h4{margin:0;font-size:15px;color:var(--navy)}
.src{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px}
.conf{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.conf.h{background:var(--green-l);color:var(--green)}
.conf.m{background:var(--amber-l);color:var(--amber)}
.gate{padding:16px}
.gate h4{margin:0 0 8px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.gate li{display:flex;gap:8px;align-items:baseline}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.choice .card{padding:18px 20px;border-width:1.5px}
.choice .card.sel{border-color:var(--blue);box-shadow:0 0 0 4px #D9E6FC}
.choice h3{margin:4px 0;color:var(--navy);font-size:17px}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lane{border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.lane.maker{background:var(--blue-ll)}
.lane.checker{background:#F8F7FE}
.lh{display:flex;flex-direction:column;margin-bottom:12px}
.lh b{font-size:17px;color:var(--navy)}
.lh span{font-size:13px;color:var(--muted)}
.lane .card{padding:12px 14px;margin-bottom:10px}
.lane .card:last-child{margin-bottom:0}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.loop{margin-top:14px;text-align:center;padding:10px;border:1px dashed #B9C3D3;border-radius:8px;color:var(--muted);font-weight:600}
.code{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.codebox{background:#FBFCFE;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--white);font-size:13px}
pre.src-code{margin:0;padding:10px 0;font-family:var(--mono);font-size:12.6px;line-height:1.5;overflow:auto;max-height:calc(100vh - 330px)}
.ln{display:block;padding:0 14px 0 0;white-space:pre}
.ln i{display:inline-block;width:38px;text-align:right;margin-right:14px;color:#AAB1BE;font-style:normal;user-select:none}
.ln.todo{background:#FFF6E0}
.tk-k{color:#1757B8;font-weight:600}.tk-s{color:#157F3B}.tk-c{color:#8A6100;font-style:italic}.tk-b{color:#7A3FB8}
.score{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:0 0 108px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--white)}
.tile b{display:block;font-size:24px;color:var(--navy);line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad{border-color:#F4C7C2;background:var(--red-l)}.tile.bad b{color:var(--red)}
.tile.warn{border-color:#F2D199;background:var(--amber-l)}.tile.warn b{color:var(--amber)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#EEF0F4;margin:6px 0}
.bar i{display:block}
.explain{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin-top:10px}
.explain dt{font-weight:600;color:var(--muted);font-size:13px}
.explain dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:12px}
.seg span{padding:6px 12px;font-size:13px;border-right:1px solid var(--line);background:var(--white)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--green);color:#fff;font-weight:600}
.cmp td b{font-size:18px;color:var(--navy)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 26px}
.timeline li::before{content:"";position:absolute;left:6px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:-2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .tm{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.prbox{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12.8px;white-space:pre-wrap;line-height:1.5}
.drop{border:1.5px dashed #AFC5EC;border-radius:var(--radius);padding:22px;text-align:center;background:var(--blue-ll)}
.filechip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--white);border-radius:7px;padding:6px 10px;font-family:var(--mono);font-size:13px;margin:4px}

/* ---------- Cover / close ---------- */
.cover{min-height:calc(100vh - 170px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover svg{width:120px;height:90px}
.cover .wm{font-weight:800;letter-spacing:.08em;color:var(--navy);font-size:44px;margin-top:10px;line-height:1}
.cover .tagl{letter-spacing:.14em;color:var(--navy);font-weight:600;margin-top:8px;font-size:14px}
.cover h2{font-size:30px;color:var(--blue-d);margin:28px 0 8px;font-weight:700}
.cover p{color:var(--muted);max-width:60ch;margin:0 auto}
.principle{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.principle .card{padding:16px;text-align:left}
.principle .card b{display:block;color:var(--navy);font-size:16px;margin:6px 0 2px}
.paths{max-width:880px;margin:26px auto 0;text-align:left}
.pathrow{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow:last-child{border-bottom:0}
.pathrow .seq{font-size:20px;letter-spacing:.1em}
.pathrow .seq small{font-size:12px;color:var(--muted);letter-spacing:0;margin-left:8px}

/* ---------- Presenter bar + notes ---------- */
.pbar{position:fixed;left:86px;right:0;bottom:0;height:58px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;z-index:20;backdrop-filter:blur(6px)}
.pbar .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.pbar select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink)}
.pbar .sp{flex:1}
.pbar .hint{font-size:12px;color:#9AA1B0}
.pbar button:focus-visible,.pbar select:focus-visible{outline:3px solid #9CC0F7;outline-offset:2px}
.note{position:fixed;right:22px;bottom:72px;width:380px;background:var(--navy);color:#E9EEF8;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;z-index:30;box-shadow:0 10px 30px rgba(20,30,60,.25);display:none}
.note.show{display:block}
.note b{color:#fff}
.note .nt{font-size:12px;font-weight:700;color:#9EC1FA;margin-bottom:4px}

@media (max-width:1100px){.p1,.code,.lanes,.grid2,.choice,.entry{grid-template-columns:1fr}.p1{height:auto}.tiles{grid-template-columns:repeat(3,1fr)}.principle{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.stepper{overflow:auto}}
/* ---------- v2: single workspace ---------- */
.wsbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.wsbar .t{font-size:19px;font-weight:700;color:var(--navy);margin-right:10px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 262px);min-height:460px;transition:grid-template-columns .35s ease}
.ws.exp{grid-template-columns:.7fr 1.6fr}
.wpanel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:4px 8px 0;overflow-x:auto;flex:0 0 auto}
.tab{border:0;background:none;padding:10px 8px 8px;border-bottom:2.5px solid transparent;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;position:relative}
.tab.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.tab.lock{color:#C6CBD4;cursor:not-allowed}
.tab.new:not(.on)::after{content:"";position:absolute;top:8px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.tab:focus-visible,.expbtn:focus-visible{outline:3px solid #9CC0F7;outline-offset:-3px}
.expbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--ink);white-space:nowrap}
.tabbody{flex:1;overflow:auto;padding:14px 18px 18px;scroll-behavior:smooth}
.tabbody .psec{padding:10px 0}
.divider{align-self:center;font-size:12.5px;font-weight:700;color:var(--blue-d);background:var(--blue-l);padding:4px 14px;border-radius:999px;border:1px solid #CADCF8}
.choices{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0;border-top:1px solid var(--line)}
.choices .lbl{width:100%;font-size:12px;color:var(--muted);font-weight:600}
.cbtn{border:1.5px solid var(--blue);background:#fff;color:var(--blue-d);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px}
.cbtn.esc{border-color:#C9CFD9;color:var(--ink)}
.cbtn.next{background:var(--blue);color:#fff;box-shadow:0 0 0 4px #D9E6FC}
.composer.nob{border-top:0}
.fake-input.dis{background:#F3F5F8;color:#8A92A3}
.clip{width:42px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:16px}
.clip.pulse{border-color:var(--blue);background:var(--blue-l);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,111,224,.45)}100%{box-shadow:0 0 0 10px rgba(31,111,224,0)}}
.dlcard{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px}
.diff{font-family:var(--mono);font-size:12.4px;line-height:1.6;border:1px solid var(--line);border-radius:8px;overflow:auto;background:#FBFCFE;padding:6px 0}
.dl{display:block;white-space:pre;padding:0 12px}
.dl b{display:inline-block;width:16px;font-weight:700}
.dl.add{background:#E9F7EE;color:#135E2F}
.dl.del{background:#FDEEEE;color:#9B1C12}
.dl.gap{color:#9AA1B0;background:#F3F5F8;font-style:italic}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.snip{font-family:var(--mono);font-size:12.2px;white-space:pre;padding:8px 10px;border-radius:6px;overflow:auto;line-height:1.5}
.snip.b{background:#FDEEEE;color:#7A1A12}.snip.a{background:#E9F7EE;color:#135E2F}
.sect{margin-top:16px}
.lanes.one{grid-template-columns:1fr 1fr}
.ws .code{grid-template-columns:1.9fr 1fr}

</style>

<script>
(function(){
"use strict";

/* ================= Helpers ================= */
const REQ="CVDA-2026-0001";
const MARK='<svg viewBox="0 0 64 48" aria-hidden="true"><path d="M14 10L4 24l10 14" fill="none" stroke="#2A6BE0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 10l10 14-10 14" fill="none" stroke="#2A6BE0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31" cy="21" r="12" fill="none" stroke="#1F5FD0" stroke-width="4"/><path d="M39.5 29.5L46 37" stroke="#1F5FD0" stroke-width="5" stroke-linecap="round"/><rect x="25" y="21" width="3" height="6" fill="#1F5FD0"/><rect x="29.5" y="17" width="3" height="10" fill="#1F5FD0"/><rect x="34" y="14" width="3" height="13" fill="#1F5FD0"/></svg>';
const PILL={"DRAFT":"grey","CLARIFICATION IN PROGRESS":"blue","DECISION REQUIRED":"amber","READY FOR CONFIRMATION":"violet","CONFIRMED FOR DISCOVERY":"green","SEARCHING":"blue","SIMILAR IMPLEMENTATION FOUND":"green","READY FOR CODE GENERATION":"green","GENERATING":"blue","ACCEPTABLE FOR DEVELOPER COMPLETION":"green","WITH DEVELOPER":"violet","REVIEWING":"blue","CONDITIONALLY ACCEPTABLE":"amber","REVISION REQUIRED":"red","READY FOR HUMAN REVIEW":"green","READY FOR BITBUCKET SUBMISSION":"green","POLICY CHECK PASSED":"green","INTENT CONFIRMED":"green"};
const pill=t=>`<span class="pill p-${PILL[t]||"grey"}">${t}</span>`;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const ENV='<span class="env">🏷️ Envisioned</span>';
const ILLUS='<div class="illus">Illustrative data. File paths, commit IDs, rule IDs, and timings are examples only.</div>';
const file=(ic,n)=>`<span class="filechip">${ic} ${n}</span>`;

/* ================= Stepper ================= */
const PHASES=[{e:"💬",n:"Understand"},{e:"🔍",n:"Discover"},{e:"🚦",n:"Readiness Gate"},{e:"⚙️",n:"Generate + Check"},{e:"🛡️",n:"Preliminary Review"},{e:"🚀",n:"Handoff"}];
function stepperMain(cur){
  return PHASES.map((p,i)=>{const n=i+1,cls=n<cur?"done":(n===cur?"cur":"");
    return `${i?'<span class="arrow">▶</span>':""}<div class="st ${cls}"><span class="dot">${n<cur?"✅":p.e}</span><span><span class="n">${n}</span> ${p.n}</span></div>`;}).join("");
}
function stepperP3(cur){
  const s=[{e:"📝",n:"Quick intent"},{e:"🔍",n:"Quick discovery"},{e:"🛡️",n:"5 Preliminary Review"},{e:"🚀",n:"6 Handoff"}];
  return '<span class="path-tag">Path 3: Review my code</span>'+s.map((p,i)=>{const n=i+1,cls=n<cur?"done":(n===cur?"cur":"");
    return `${i?'<span class="arrow">▶</span>':""}<div class="st ${cls}"><span class="dot">${n<cur?"✅":p.e}</span><span>${p.n}</span></div>`;}).join("");
}

/* ================= Cover / Home / Close ================= */
function cover(){
  return `<div class="cover">${MARK}<div class="wm">CODEVISION</div><div class="tagl">MODERNIZING LEGACY CODE</div>
    <h2>Developer Assistant</h2>
    <p>A governed, chat-based assistant that helps developers, including rotating interns and juniors, understand a change, reuse what already exists, start from standards-aligned Python, and get early review feedback.</p>
    <p class="small" style="margin-top:22px">Concept demo. Press <b>Next</b> or the right arrow key to begin.</p></div>`;
}
function home(focus){
  return `<div class="shead"><div><h1>Developer Assistant</h1><p class="sub">Start a new change, or get your own code reviewed before it goes to Bitbucket.</p></div></div>
  <div class="hero">${MARK}<h2>What would you like to work on?</h2><p class="muted" style="margin:0">Everything happens in one chat. Results appear in the side panel. Nothing is committed for you.</p></div>
  <div class="entry ${focus?"focus-"+focus:""}">
    <div class="card a"><div class="ic">💬</div><h3>Start a change request</h3><p class="muted" style="margin:0">Describe what you need in plain words. I'll clarify it, check what already exists, and can generate starter code for you to download.</p></div>
    <div class="card b"><div class="ic">🛡️</div><h3>Review my code</h3><p class="muted" style="margin:0">Already written it? Upload your code for a preliminary review against CodeVision standards.</p></div>
  </div>
  <div class="grid2">
    <div class="card pad"><div class="h3">📌 Guided templates <span class="muted small" style="font-weight:400">(set by Admin)</span></div>
      <div class="chips"><span class="chip">📄 Add a new file type</span><span class="chip">🐞 Fix a defect</span><span class="chip">✨ Enhance an existing feature</span><span class="chip">⚙️ Change configuration</span></div></div>
    <div class="card pad"><div class="h3">🕘 My recent requests</div>
      <table class="t"><tr><th>Request</th><th>Title</th><th>Status</th></tr>
      <tr><td class="mono">CVDA-2026-0000</td><td>Add page numbers to Create Docs export</td><td>${pill("DECISION REQUIRED")}</td></tr>
      <tr><td class="mono">CVDA-2025-0142</td><td>Show source file name in Chat answers</td><td>${pill("CONFIRMED FOR DISCOVERY")}</td></tr></table></div>
  </div>`;
}
function closing(){
  const pr=[["💬","Understand","before it searches"],["🔍","Search","before it generates"],["🛡️","Review","before it presents"],["👤","Humans","stay accountable before code is accepted"]];
  return `<div class="cover" style="min-height:auto;padding-top:16px">${MARK}<h2 style="margin-top:12px">One control principle</h2>
    <div class="principle" style="margin-top:14px">${pr.map(p=>`<div class="card"><span style="font-size:22px">${p[0]}</span><b>${p[1]}</b><span class="muted small">${p[2]}</span></div>`).join("")}</div>
    <div class="card pad paths"><div class="h3">Three ways in, one standard of review</div>
      <div class="pathrow"><b>Path 1: Full</b><span class="seq">💬 🔍 🚦 ⚙️ 🛡️ 🚀<small>Understand, discover, gate, generate, review, handoff</small></span></div>
      <div class="pathrow"><b>Path 2: Self-write</b><span class="seq">💬 🔍 🚦 ✍️ 🛡️ 🚀<small>Same, but the developer writes the code</small></span></div>
      <div class="pathrow"><b>Path 3: Review only</b><span class="seq">📝 🔍 🛡️ 🚀<small>Quick intent and quick discovery, then review</small></span></div>
    </div></div>`;
}

/* ================= Chat scripts ================= */
const Q=(n,t)=>`<span class="q">Question ${n} of 4: ${t}</span>`;
const DIV=h=>({w:"div",h});
const MAIN=[
/*0*/{w:"dev",h:"Users keep asking if they can upload Excel files into CodeVision. Can we support that?"},
/*1*/{w:"ai",h:`Happy to help. Before anything gets built, I'll make sure we agree on what's needed. Four short questions.${Q(1,"What needs to change, and why?")}Is the goal to let Excel content go through the same document-ingestion flow as PDFs?`},
/*2*/{w:"dev",h:"Yes. Teams keep technical inventories in Excel and have to convert them to PDF before uploading. We want Excel to go straight into ingestion."},
/*3*/{w:"ai",h:`Clear.${Q(2,"What happens today?")}Which screen or step stops Excel files right now? You don't need to know the source files.`},
/*4*/{w:"dev",h:"The upload screen only accepts PDF and DOCX. Excel files get rejected during file-type validation."},
/*5*/{w:"ai",h:`Got it.${Q(3,"What should happen after the change?")}Describe the end-to-end behaviour you expect.`},
/*6*/{w:"dev",h:"CodeVision should validate the Excel file, extract the content from the worksheets, and pass it into the existing ingestion process."},
/*7*/{w:"ai",h:`${Q(4,"What are the inputs, outputs, and important success or failure cases?")}Think about what could go wrong, not only the happy path.`},
/*8*/{w:"dev",h:".xlsx workbooks in. Output is the normal ingestion format. It should handle workbooks with several sheets, and reject empty, corrupted, or password-protected files."},
/*9*/{w:"ai",h:`Thanks, all four answered.<div class="decide"><b>⚠️ One decision needed</b><br>You said "extract the content from the worksheets". Workbooks can contain hidden sheets. This changes what gets extracted, so I won't assume it. Please choose below.</div>`},
/*10*/{w:"dev",h:"Visible worksheets only."},
/*11*/{w:"ai",h:`Noted as a confirmed decision.<span class="q">Optional: constraints, exclusions, or references?</span>If there's an existing feature I should use as a reference, tell me. Not sure? Skip it.`},
/*12*/{w:"dev",h:"Use the existing PDF processing as a reference."},
/*13*/{w:"ai",h:"Here's my understanding. Please check the Summary tab, then choose how to continue."},
/*14*/{w:"dev",h:"✅ Proceed with this understanding"},
/*15*/{w:"ai",h:`Request <b>${REQ}</b> is saved as version 1. ${pill("CONFIRMED FOR DISCOVERY")}
<div class="yaml"><span class="k">request_id:</span> ${REQ}
<span class="k">title:</span> Add Excel document processing
<span class="k">status:</span> confirmed_for_discovery
<span class="k">version:</span> 1
<span class="k">decisions:</span>
  - Process visible worksheets only
<span class="k">references:</span>
  - Existing PDF-processing capability</div>`},
/*16*/{w:"dev",h:"🔍 Proceed to Discovery"},
/*17*/DIV("🔍 Phase 2: Discover"),
/*18*/{w:"ai",h:"Searching approved CodeVision sources using your confirmed request. Secrets, environment files, deprecated, and restricted content are never retrieved."},
/*19*/{w:"ai",h:"Search complete. File-type validation <b>already exists</b>, and the PDF processor is a close match to what you need. Details are in the Discovery tab. Do these findings look right?"},
/*20*/{w:"dev",h:"✅ Findings look right"},
/*21*/DIV("🚦 Phase 3: Readiness Gate"),
/*22*/{w:"ai",h:`All 4 readiness gates passed. ${pill("READY FOR CODE GENERATION")}<br>How do you want to continue?`},
/*23*/{w:"dev",h:"⚙️ Generate starter code"},
/*24*/DIV("⚙️ Phase 4: Generate + Check"),
/*25*/{w:"ai",h:"Generating starter code with Qwen. A separate Checker reviews it before you see anything."},
/*26*/{w:"ai",h:"Attempt 1 had 2 findings, so it went back for a rebuild. Attempt 2 cleared all blocking checks."},
/*27*/{w:"ai",h:`Your starter code is ready. Download it, complete the marked areas in your own IDE, then upload your finished code here.
<div class="dlcard"><div>${file("🐍","excel_processor.py")}${file("📄",REQ+"_context.md")}</div><div class="muted small" style="margin:6px 0 8px">The context sheet has the confirmed request, what you need to complete, references, and assumptions.</div><span class="btn primary" style="display:inline-block">⬇️ Download starter code (.zip)</span></div>`},
/*28*/{w:"dev",h:`${file("📎","excel_processor.py")}<div style="margin-top:6px">Done. Here's my completed code (Round 1).</div>`},
/*29*/DIV("🛡️ Phase 5: Preliminary Review"),
/*30*/{w:"ai",h:`Received and linked to ${REQ} v1. The Code tab now shows what you changed compared with the starter code. Reviewing Round 1…`},
/*31*/{w:"ai",h:`Round 1 result: ${pill("CONDITIONALLY ACCEPTABLE")}<br><b>1 blocking finding:</b> the file-size limit is hardcoded (CV-STD-014). There are also 2 important findings. How do you want to handle the blocking one?`},
/*32*/{w:"dev",h:"💡 Suggest a fix"},
/*33*/{w:"ai",h:"Here's a suggested fix in the Review tab. <b>I won't change your code.</b> Apply it in your IDE, along with the 2 important findings, then upload Round 2. I'll re-run the full review, not only the changed lines."},
/*34*/{w:"dev",h:`${file("📎","excel_processor.py")}<div style="margin-top:6px">Fixed. Here's Round 2.</div>`},
/*35*/{w:"ai",h:`Round 2 result: <b>0 blocking findings.</b> All 3 earlier findings are resolved and nothing new was found. ${pill("READY FOR HUMAN REVIEW")}`},
/*36*/{w:"dev",h:"🚀 Prepare handoff"},
/*37*/DIV("🚀 Phase 6: Handoff"),
/*38*/{w:"ai",h:"Your pull-request summary and audit trail are in the Audit tab. Submit through the normal Bitbucket process. <b>I never commit, merge, or approve.</b>"}
];
const P3=[
/*0*/{w:"dev",h:`${file("📎","docx_loader.py")}<div style="margin-top:6px">Can you review this before I raise a PR?</div>`},
/*1*/{w:"ai",h:"Admin policy check passed: review-only is allowed for defect fixes, and no restricted core modules are touched.<br>There's no request record yet, so I drafted what I think your change does (see the Intent tab). Is this right?"},
/*2*/{w:"dev",h:"✏️ Correct it"},
/*3*/{w:"dev",h:"Batch size should be configurable, default 500."},
/*4*/{w:"ai",h:"Thanks, intent confirmed. A quick discovery found a shared batching helper that may already do this. Running the review…"},
/*5*/{w:"ai",h:`Result: ${pill("REVISION REQUIRED")}<br>1 blocking finding and 1 important finding. How do you want to handle them?`}
];

function msgHTML(m,isNew,d){
  const cls=isNew?`appear ${d}`:"";
  if(m.w==="div") return `<div class="divider ${cls}">${m.h}</div>`;
  const av=m.w==="ai"?`<span class="av">${MARK}</span>`:'<span class="av">D</span>';
  return `<div class="msg ${m.w} ${cls}">${av}<div class="bubble">${m.h}</div></div>`;
}
function composer(c){
  const clip=(p)=>`<button class="clip ${p?"pulse":""}" tabindex="-1" aria-hidden="true" title="Attach file">📎</button>`;
  if(c.m==="text") return `<div class="composer">${clip()}<div class="fake-input">${c.ph||"Type your message…"}</div><button class="send" tabindex="-1" aria-hidden="true">➤</button></div>`;
  if(c.m==="busy") return `<div class="composer">${clip()}<div class="fake-input dis">${c.ph}</div><button class="send" tabindex="-1" aria-hidden="true" style="opacity:.4">➤</button></div>`;
  if(c.m==="upload") return `<div class="composer">${clip(true)}<div class="fake-input dis">${c.ph}</div><button class="send" tabindex="-1" aria-hidden="true" style="opacity:.4">➤</button></div>`;
  /* locked: text box disabled, only choices */
  return `<div class="choices"><span class="lbl">🔒 Choose an option to continue</span>${c.ch.map((x,i)=>`<span class="cbtn ${x.e?"esc":""} ${c.pick===i?"next":""}">${x.t}</span>`).join("")}</div>
  <div class="composer nob">${clip()}<div class="fake-input dis">Text input is paused until you choose</div><button class="send" tabindex="-1" aria-hidden="true" style="opacity:.4">➤</button></div>`;
}

/* ================= Tab: Summary (Phase 1 live panel) ================= */
const FULLFLOW=["Receive the Excel workbook.","Validate that the workbook is an approved and readable type.","Reject unsupported, empty, corrupted, or protected workbooks.","Read the permitted worksheets.","Extract the required content.","Convert the content into the expected ingestion format.","Pass the result into the existing CodeVision ingestion process.","Return the standard CodeVision outcome or error response."];
const PS=[];
let s={prog:0,ptxt:"0 of 4 mandatory questions answered",objective:"",reason:"",current:"",expected:"",inputs:"",outputs:"",success:[],failure:[],inScope:[],outScope:[],flow:[],assumptions:[],open:[],refs:[],fresh:[]};
PS.push(s);
s={...s,prog:1,ptxt:"1 of 4 mandatory questions answered",objective:"Allow approved Excel workbooks to enter the existing CodeVision document-ingestion flow.",reason:"Users currently convert Excel documents into another supported format before ingestion.",fresh:["objective","reason"]};PS.push(s);
s={...s,prog:2,ptxt:"2 of 4 mandatory questions answered",current:"Excel files are rejected during file-type validation. Only PDF and DOCX are accepted.",fresh:["current"]};PS.push(s);
s={...s,prog:3,ptxt:"3 of 4 mandatory questions answered",expected:"Accept Excel, validate the workbook, extract worksheet content, and pass it into the current ingestion flow.",flow:["Receive the Excel workbook.","Validate the workbook.","Extract the worksheet content.","Pass the result into the existing ingestion process."],inScope:["Excel upload into the existing ingestion flow"],fresh:["expected","flow","scope"]};PS.push(s);
s={...s,prog:4,ptxt:"Clarification required: 1 open item",warn:true,inputs:".xlsx workbook",outputs:"Extracted content in the existing normalized ingestion format",success:["Valid workbook with one worksheet","Valid workbook with multiple worksheets"],failure:["Empty workbook","Corrupted workbook","Password-protected workbook","Unsupported file type"],flow:FULLFLOW,outScope:["Legacy .xls files","Changes to PDF or DOCX handling"],open:["Hidden worksheets: process or ignore?"],fresh:["io","scen","open","scope"]};PS.push(s);
s={...s,ptxt:"4 of 4 answered, no open items",warn:false,open:[],success:["Valid workbook with one worksheet","Valid workbook with multiple visible worksheets"],flow:FULLFLOW.map(x=>x.replace("permitted","visible")),outScope:["Legacy .xls files","Hidden worksheets (decided: ignore)","Changes to PDF or DOCX handling"],assumptions:["Minor details such as log wording and naming follow approved CodeVision standards."],fresh:["open","scen","scope","assume"]};PS.push(s);
s={...s,ptxt:"Ready for confirmation",refs:["Existing PDF-processing capability"],fresh:["refs"]};PS.push(s);
s={...s,ptxt:"Confirmed and saved as version 1",fresh:[]};PS.push(s);

function fld(label,val,key,st){const fr=st.fresh.includes(key)?" fresh":"";return `<div class="f${fr}"><div class="fl">${label}</div>${val?`<div class="fv">${val}</div>`:'<div class="fv empty">Waiting for your answer</div>'}</div>`;}
function lst(arr,key,st,empty,ordered){const fr=st.fresh.includes(key)?" fresh":"";if(!arr.length)return `<div class="f${fr}"><div class="fv empty">${empty}</div></div>`;const tag=ordered?"ol":"ul";return `<div class="f${fr}"><${tag} class="${ordered?"flow":"clean"}">${arr.map(x=>`<li>${x}</li>`).join("")}</${tag}></div>`;}
function tabSummary(k){
  const st=PS[k], segs=[0,1,2,3].map(i=>`<span class="${i<st.prog?"on":""}"></span>`).join("");
  const blk=(l,a,e)=>`<div class="fl">${l}</div>${a.length?`<ul class="clean">${a.map(x=>`<li>${e} ${x}</li>`).join("")}</ul>`:'<div class="fv empty">Not yet defined</div>'}`;

class ExcelProcessor:

  <div class="card pad sect"><div class="h3">📝 Drafted from your code</div><div class="bubble" style="background:var(--blue-ll)">Fixes a timeout when ingesting large DOCX files by processing paragraphs in batches.</div>
  ${state==="confirmed"?`<div class="fl" style="margin-top:12px">Developer correction</div><div class="bubble fresh">Batch size should be configurable, default 500.</div><p class="ok" style="margin:10px 0 0">✅ Intent confirmed by developer</p>`:`<p class="small muted" style="margin:10px 0 0">Waiting for the developer to confirm or correct.</p>`}</div>
  <div class="card pad sect"><div class="h3">🧾 Review basis</div><p style="margin:0">Developer-declared intent. There is no confirmed request record on this path.</p></div>`;
}
function tabP3Discovery(){
  return `<div class="card find" style="border-color:#F2D199"><div class="muted small">🔁 Similar implementation</div><h4>Shared batching helper</h4><p style="margin:6px 0 0">A reusable helper already exists. This change may duplicate it.</p><div class="src">utils/batching.py @ 9b20d7e</div></div>
  <p class="small muted" style="margin:12px 0 0">Duplication checks need discovery, so a quick one always runs, even on this path.</p>${ILLUS}`;
}
function tabP3Review(){
  return `<div class="banner v">🧾 <span class="grow"><b>Review basis:</b> developer-declared intent, not a confirmed request. Functional alignment is checked against that intent only.</span></div>
  <div class="card pad"><div class="score">${ring(71,"#D9483B")}<div><div class="muted small">Result</div><div style="font-size:20px;font-weight:700;color:var(--red)">REVISION REQUIRED</div></div></div><div style="margin-top:14px">${tiles([1,0,1,1,2])}</div></div>
  <div class="card pad sect"><div class="h3">Findings</div><table class="t"><tr><td>⛔</td><td>Batch size hardcoded as 500<div class="mono muted small">CV-STD-014 Configuration must be externalised</div></td></tr><tr><td>⚠️</td><td>Duplicates the shared batching helper<div class="mono muted small">Reinvention of existing function, utils/batching.py</div></td></tr><tr><td>💬</td><td>2 advisory suggestions<div class="mono muted small">Naming, docstrings</div></td></tr></table>
  <p class="small muted" style="margin:10px 0 0">From here, the same fix loop applies: suggest a fix, apply in the IDE, re-upload, re-review, then handoff.</p></div>${ILLUS}`;
}

/* ================= Workspace renderer ================= */
const TABS={
  main:[["summary","📋 Summary"],["discovery","🔍 Discovery"],["gate","🚦 Gate"],["code","⚙️ Code"],["review","🛡️ Review"],["audit","🧾 Audit"]],
  p3:[["intent","📝 Intent"],["discovery","🔍 Discovery"],["review","🛡️ Review"]]
};
function tabContent(b,t){
  const st=b.st;
  if(b.ws==="main"){
    if(t==="summary") return tabSummary(st.p1);
    if(t==="discovery") return tabDiscovery(st.disc);
    if(t==="gate") return tabGate();
    if(t==="code") return tabCode(st.code);
    if(t==="review") return review(st.review);
    if(t==="audit") return tabAudit();
  } else {
    if(t==="intent") return tabIntent(st.intent);
    if(t==="discovery") return tabP3Discovery();
    if(t==="review") return tabP3Review();
  }
  return "";
}
let viewTab=null, expOverride=null;
function workspace(b){
  const msgs=b.ws==="main"?MAIN:P3;
  const prev=b.prevUpto;
  let d=0;
  const body=msgs.slice(0,b.upto+1).map((m,i)=>{const isNew=i>prev;if(isNew)d++;return msgHTML(m,isNew,isNew&&d>1?"d"+Math.min(d-1,9):"");}).join("");
  const tab=viewTab||b.tab;
  const exp=expOverride===null?b.exp:expOverride;
  const tabs=TABS[b.ws].map(([k,l])=>{const un=b.unlocked.includes(k);return `<button class="tab ${k===tab?"on":""} ${un?"":"lock"} ${b.newTabs&&b.newTabs.includes(k)?"new":""}" data-tab="${k}" ${un?"":"disabled"}>${l}</button>`;}).join("");
  return `<div class="wsbar"><div><span class="t">${b.title}</span>${b.ws==="main"&&b.st.p1>=0?`<span class="rid">${REQ}</span>`:""}</div><div class="sright">${b.env?ENV:""}${pill(b.status)}</div></div>
  <div class="ws ${exp?"exp":""}">
    <section class="card chat"><div class="chat-head">💬 Developer Assistant chat ${b.lockNote?`<span class="lock">${b.lockNote}</span>`:""}</div>
      <div class="chat-body" id="chatBody">${body}</div>${composer(b.comp)}</section>
    <aside class="card wpanel"><div class="tabs" role="tablist">${tabs}<button class="expbtn" id="expBtn" aria-label="${exp?"Collapse panel":"Expand panel"}" title="${exp?"Collapse panel":"Expand panel"}">${exp?"⤡":"⤢"}</button></div>
      <div class="tabbody" id="tabBody">${tabContent(b,tab)}</div></aside>
  </div>`;
}

/* ================= Beats ================= */
const B=[];
let S={}, lastUpto=-1, lastWs=null;
function ws(o){
  if(o.ws!==lastWs){S={};lastUpto=-1;lastWs=o.ws;}
  S={...S,...(o.st||{})};
  B.push({kind:"ws",prevUpto:lastUpto,...o,st:{...S}});
  lastUpto=o.upto;
}
const other=(ch,step,render,note)=>B.push({kind:"page",ch,step,render,note});
const L=(arr,pick,esc)=>({m:"locked",ch:arr.map((t,i)=>({t,e:esc&&esc.includes(i)})),pick});

other("Introduction",null,cover,"<b>Open here.</b> The Developer Assistant is one planned capability inside CodeVision. It targets the repeated onboarding cost of rotating interns and junior developers.");
other("Home",null,()=>home("a"),"<b>Two entry points.</b> Start a change request for new work, or Review my code for code already written. From here, everything happens in <b>one chat</b>, with results in the side panel.");

const P1N=["The developer asks in plain words. The assistant <b>does not jump to code</b>; it asks first, like a senior developer. Note the banner: no code in Phase 1.","Question 1 answered. The <b>Summary tab</b> fills in live as the conversation happens. Qwen interprets; CodeVision application logic validates the structure.","Question 2 establishes the current state. The developer does <b>not</b> need to know exact source files.","Question 3 defines the expected behaviour. A plain-language <b>functional flow</b> appears, with no invented class or function names.","A <b>material ambiguity</b> is spotted. The chat <b>locks</b>: the text box is disabled and only choices are shown, always with an escape option.","The decision is recorded. <b>Minor ambiguity</b> such as log wording is resolved using standards and labelled as an assumption. References are optional.","The developer checks the summary and chooses: <b>proceed, correct, or get help deciding</b>. Unresolved material decisions stop progression.","The confirmed request is <b>stored and versioned</b>. This record, not the raw chat, drives everything that follows."];
const P1C=[{m:"text"},{m:"text"},{m:"text"},{m:"text"},L(["Visible worksheets only","All worksheets, including hidden","🤔 I need help deciding"],0,[2]),{m:"text",ph:"Type a reference, or say skip…"},L(["✅ Proceed with this understanding","✏️ Correct something","🤔 I need help deciding"],0,[2]),L(["🔍 Proceed to Discovery"],0)];
const P1S=["DRAFT","CLARIFICATION IN PROGRESS","CLARIFICATION IN PROGRESS","CLARIFICATION IN PROGRESS","DECISION REQUIRED","CLARIFICATION IN PROGRESS","READY FOR CONFIRMATION","CONFIRMED FOR DISCOVERY"];
[1,3,5,7,9,11,13,15].forEach((u,k)=>ws({ws:"main",ch:"Phase 1: Understand",step:1,upto:u,title:k<3?"New change request":"Add Excel document processing",status:P1S[k],env:false,lockNote:"🔒 No code is generated in Phase 1",tab:"summary",unlocked:["summary"],exp:false,comp:P1C[k],st:{p1:k},note:P1N[k]}));

ws({ws:"main",ch:"Phase 2: Discover",step:2,upto:18,title:"Add Excel document processing",status:"SEARCHING",env:true,tab:"discovery",unlocked:["summary","discovery"],newTabs:["discovery"],exp:false,comp:{m:"busy",ph:"⏳ Searching approved sources…"},st:{disc:"search"},note:"<b>Envisioned.</b> Same chat, new phase. The panel switches to the <b>Discovery tab</b>. CodeVision searches a pre-built index of approved Bitbucket content, not the whole repository."});
ws({ws:"main",ch:"Phase 2: Discover",step:2,upto:19,title:"Add Excel document processing",status:"SIMILAR IMPLEMENTATION FOUND",env:true,tab:"discovery",unlocked:["summary","discovery"],exp:false,comp:L(["✅ Findings look right","✏️ Something's missing","🙋 Escalate to a senior developer"],0,[2]),st:{disc:"results"},note:"Findings come with <b>sources and commit IDs</b>. The developer learns that validation and a similar PDF processor already exist, so they reuse instead of duplicating."});
ws({ws:"main",ch:"Phase 3: Readiness Gate",step:3,upto:22,title:"Add Excel document processing",status:"READY FOR CODE GENERATION",env:true,tab:"gate",unlocked:["summary","discovery","gate"],newTabs:["gate"],exp:false,comp:L(["⚙️ Generate starter code","✍️ I'll write it myself","🤔 I need help deciding"],0,[2]),note:"Four gates must pass, and <b>only READY FOR CODE GENERATION</b> invokes the generator. The developer chooses: generate, or <b>write it myself</b> (skips only Phase 4)."});
ws({ws:"main",ch:"Phase 4: Generate + Check",step:4,upto:25,title:"Add Excel document processing",status:"GENERATING",env:true,tab:"code",unlocked:["summary","discovery","gate","code"],newTabs:["code"],exp:true,comp:{m:"busy",ph:"⏳ Generating and checking…"},st:{code:"a1"},note:"<b>Maker-checker</b>, a principle banking already uses. Qwen drafts; a separate checker reviews blind. The Rule Gate makes objective blocking decisions; the Independent Reviewer adds judgement. The panel <b>expands</b> for bigger content."});
ws({ws:"main",ch:"Phase 4: Generate + Check",step:4,upto:26,title:"Add Excel document processing",status:"GENERATING",env:true,tab:"code",unlocked:["summary","discovery","gate","code"],exp:true,comp:{m:"busy",ph:"⏳ Finalising starter code…"},st:{code:"a2"},note:"Findings go back to Qwen for a <b>capped</b> number of rebuilds. The developer only sees code once blocking issues are cleared."});
ws({ws:"main",ch:"Phase 4: Generate + Check",step:4,upto:27,title:"Add Excel document processing",status:"WITH DEVELOPER",env:true,tab:"code",unlocked:["summary","discovery","gate","code"],exp:true,comp:{m:"upload",ph:"Waiting for your upload. Attach your code with 📎"},st:{code:"starter"},note:"<b>Download, don't edit here.</b> The developer downloads starter code plus a context sheet, completes it in their own IDE, and uploads it back. The assistant stays read-only."});
ws({ws:"main",ch:"Phase 5: Preliminary Review",step:5,upto:30,title:"Add Excel document processing",status:"REVIEWING",env:true,tab:"code",unlocked:["summary","discovery","gate","code"],exp:true,comp:{m:"busy",ph:"⏳ Reviewing Round 1…"},st:{code:"diff"},note:"The upload is <b>linked to the request</b> automatically. A <b>diff against the starter code</b> shows exactly what the AI wrote versus what the developer wrote, useful for the human reviewer later."});
ws({ws:"main",ch:"Phase 5: Preliminary Review",step:5,upto:31,title:"Add Excel document processing",status:"CONDITIONALLY ACCEPTABLE",env:true,tab:"review",unlocked:["summary","discovery","gate","code","review"],newTabs:["review"],exp:true,comp:L(["🔧 I'll fix it myself","💡 Suggest a fix","🚫 False positive","➖ Not applicable","⚠️ Risk accepted"],1,[2,3,4]),st:{review:"r1"},note:"Round 1 report. A score alone is not enough: <b>one blocking finding stops the handoff</b>, whatever the score. The developer responds per finding, in the chat. Risk-accepted items are carried to the PR summary."});
ws({ws:"main",ch:"Phase 5: Preliminary Review",step:5,upto:33,title:"Add Excel document processing",status:"CONDITIONALLY ACCEPTABLE",env:true,tab:"review",unlocked:["summary","discovery","gate","code","review"],exp:true,comp:{m:"upload",ph:"Waiting for Round 2. Apply the fixes in your IDE, then attach with 📎"},st:{review:"fix"},note:"<b>Qwen suggests, the developer applies.</b> Every finding explains what, why, where, which rule, and a reference. The developer keeps ownership and learns the standard."});
ws({ws:"main",ch:"Phase 5: Preliminary Review",step:5,upto:35,title:"Add Excel document processing",status:"READY FOR HUMAN REVIEW",env:true,tab:"review",unlocked:["summary","discovery","gate","code","review"],exp:true,comp:L(["🚀 Prepare handoff"],0),st:{review:"r2"},note:"Round 2: a <b>full re-review</b>, showing resolved, still open, and new findings. The loop repeats until 0 blocking, with escalation after 3 rounds."});
ws({ws:"main",ch:"Phase 6: Handoff",step:6,upto:38,title:"Add Excel document processing",status:"READY FOR BITBUCKET SUBMISSION",env:true,tab:"audit",unlocked:["summary","discovery","gate","code","review","audit"],newTabs:["audit"],exp:true,comp:{m:"text",ph:"Ask a follow-up question…"},note:"The assistant <b>hands over, it never takes over</b>. A ready PR summary plus a full audit trail. Every earlier tab is still clickable as history."});

other("Path 3: Review my code",null,()=>home("b"),"<b>Side demo.</b> For code that's already written, the developer starts from Review my code.");
ws({ws:"p3",ch:"Path 3: Review my code",step:-1,upto:1,title:"Review my code: docx_loader.py",status:"POLICY CHECK PASSED",env:true,tab:"intent",unlocked:["intent"],exp:false,comp:L(["✅ That's right","✏️ Correct it"],1),st:{intent:"draft"},note:"The Admin decides when this shortcut is allowed. With no request record, the assistant <b>drafts the intent from the code</b> for the developer to confirm."});
ws({ws:"p3",ch:"Path 3: Review my code",step:-2,upto:4,title:"Review my code: docx_loader.py",status:"INTENT CONFIRMED",env:true,tab:"discovery",unlocked:["intent","discovery"],newTabs:["discovery"],exp:false,comp:{m:"busy",ph:"⏳ Reviewing…"},st:{intent:"confirmed"},note:"The developer corrects the intent. A <b>quick discovery</b> always runs, because duplication can't be checked without it."});
ws({ws:"p3",ch:"Path 3: Review my code",step:-3,upto:5,title:"Review my code: docx_loader.py",status:"REVISION REQUIRED",env:true,tab:"review",unlocked:["intent","discovery","review"],newTabs:["review"],exp:false,comp:L(["🔧 I'll fix it myself","💡 Suggest a fix","🚫 False positive","➖ Not applicable","⚠️ Risk accepted"],null,[2,3,4]),note:"Same review framework, with the <b>basis stated openly</b>. From here, the same fix loop and handoff apply."});
other("Summary",null,closing,"<b>Close here.</b> One principle, three entry paths, one standard of review. Humans keep accountability throughout.");

/* ================= Navigation ================= */
let idx=0;
const $=id=>document.getElementById(id);
const stage=$("stage"),stepper=$("stepper"),note=$("note");
const chapters=[...new Set(B.map(b=>b.ch))];
$("jump").innerHTML=chapters.map(c=>`<option value="${c}">${c}</option>`).join("");

function paint(){
  const b=B[idx];
  stage.innerHTML=b.kind==="ws"?workspace(b):b.render();
  if(b.step===null){stepper.classList.add("hide");stepper.innerHTML="";}
  else{stepper.classList.remove("hide");stepper.innerHTML=b.step>0?stepperMain(b.step):stepperP3(-b.step);}
  $("count").textContent=`${idx+1} / ${B.length}`;
  $("back").disabled=idx===0;$("next").disabled=idx===B.length-1;
  $("jump").value=b.ch;
  note.innerHTML=`<div class="nt">💡 WHAT THIS SHOWS</div>${b.note}`;
  if(b.kind==="ws"){
    const cb=$("chatBody");cb.scrollTop=cb.scrollHeight;
    const tb=$("tabBody");const fr=tb.querySelector(".fresh");tb.scrollTop=fr?Math.max(0,fr.offsetTop-tb.offsetTop-40):0;
    stage.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{if(t.disabled)return;viewTab=t.dataset.tab;paint();});
    $("expBtn").onclick=()=>{const cur=expOverride===null?b.exp:expOverride;expOverride=!cur;paint();};
  }
}
function go(n){idx=Math.max(0,Math.min(B.length-1,n));viewTab=null;expOverride=null;history.replaceState(null,"","#"+(idx+1));window.scrollTo(0,0);paint();}
$("next").onclick=()=>go(idx+1);
$("back").onclick=()=>go(idx-1);
$("jump").onchange=e=>go(B.findIndex(b=>b.ch===e.target.value));
function toggleNotes(){const on=note.classList.toggle("show");$("notesBtn").setAttribute("aria-pressed",on);}
$("notesBtn").onclick=toggleNotes;
function toggleFS(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen();}}
$("fsBtn").onclick=toggleFS;
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT")return;
  if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(idx+1);}
  else if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(idx-1);}
  else if(e.key==="Home"){go(0);}else if(e.key==="End"){go(B.length-1);}
  else if(e.key==="n"||e.key==="N"){toggleNotes();}
  else if(e.key==="f"||e.key==="F"){toggleFS();}
});
const h=parseInt((location.hash||"").slice(1),10);
go(isNaN(h)?0:h-1);
})();
</script>
