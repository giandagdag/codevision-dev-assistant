<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeVision Developer Assistant: Admin Console Demo (updated 14 Nov 2026)</title>
<!-- Offline, self-contained. Open in Chrome or Edge. Keys: Left/Right to switch screens, N for notes. -->
<style>
:root{
  --navy:#1E2B45; --blue:#1F6FE0; --blue-d:#1757B8; --blue-l:#EAF1FD; --blue-ll:#F4F8FE;
  --ink:#2B3445; --muted:#6B7385; --line:#E3E7EE; --canvas:#F6F8FB; --white:#fff;
  --green:#157F3B; --green-l:#E7F5EC; --amber:#9A5B00; --amber-l:#FFF3DF;
  --red:#B42318; --red-l:#FDECEA; --violet:#5B4BC4; --violet-l:#EFEDFC;
  --radius:10px;
  --font:"Segoe UI", "Segoe UI Variable", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono:Consolas, "Cascadia Mono", "Courier New", monospace;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji";
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font),var(--emoji);color:var(--ink);background:var(--canvas);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---------- App frame (mirrors CodeVision: icon rail + light canvas) ---------- */
.app{display:grid;grid-template-columns:86px 1fr;min-height:100vh}
.rail{background:var(--white);border-right:1px solid var(--line);padding-top:74px;display:flex;flex-direction:column;align-items:center;gap:6px}
.ri{width:72px;padding:10px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#7A8294;font-size:12px;text-align:center;line-height:1.2}
.ri svg{width:24px;height:24px}
.ri.active{background:var(--blue-l);color:var(--blue)}
.ri.active span{font-weight:600}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:33px}
.wordmark{font-weight:800;letter-spacing:.06em;color:var(--navy);font-size:19px}
.brand .sep{width:1px;height:24px;background:var(--line)}
.brand .prod{color:var(--muted);font-size:15px}
.user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700}

/* ---------- Stepper ---------- */
.stepper{background:var(--white);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;gap:6px;align-items:center;min-height:62px}
.stepper.hide{display:none}
.st{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.st .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--canvas);border:1px solid var(--line);font-size:15px}
.st .n{font-weight:600;margin-right:2px}
.st.done{color:var(--green)}
.st.done .dot{background:var(--green-l);border-color:#BFE3CB}
.st.cur{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.st.cur .dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 4px #CFE0FB}
.st.skip{opacity:.45;text-decoration:line-through}
.arrow{color:#B7BECB;font-size:12px}
.path-tag{margin-right:10px;padding:4px 10px;border-radius:6px;background:var(--violet-l);color:var(--violet);font-weight:600;font-size:13px}

/* ---------- Stage ---------- */
.stage{padding:22px 28px 96px;max-width:1400px;width:100%}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:16px}
.shead h1{font-size:23px;margin:0;color:var(--navy);font-weight:700;letter-spacing:-.01em}
.shead .sub{margin:3px 0 0;color:var(--muted);max-width:72ch}
.sright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rid{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--white);border:1px solid var(--line);padding:4px 8px;border-radius:6px}
.env{font-size:12.5px;font-weight:600;color:var(--violet);background:var(--violet-l);border:1px dashed #B9B0EE;padding:4px 9px;border-radius:6px}
.illus{margin-top:14px;font-size:12px;color:#9098A8}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.02em;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-grey{background:#EEF0F4;color:#5A6273}
.p-blue{background:var(--blue-l);color:var(--blue-d)}
.p-amber{background:var(--amber-l);color:var(--amber)}
.p-violet{background:var(--violet-l);color:var(--violet)}
.p-green{background:var(--green-l);color:var(--green)}
.p-red{background:var(--red-l);color:var(--red)}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px 20px}
.h3{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.btn{border:1px solid var(--blue);color:var(--blue);background:var(--white);padding:8px 16px;border-radius:6px;font-weight:600}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.sel{box-shadow:0 0 0 3px #CFE0FB}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:600}
ul.clean{margin:0;padding:0;list-style:none}
ul.clean li{padding:3px 0}
ol.flow{margin:0;padding-left:22px}
ol.flow li{padding:2px 0}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--green-l);color:var(--green);margin-left:6px}
.tag.b{background:var(--blue-l);color:var(--blue-d)}

/* ---------- Motion ---------- */
.appear{animation:appear .35s ease-out both}
.d1{animation-delay:.55s}.d2{animation-delay:.9s}.d3{animation-delay:1.25s}.d4{animation-delay:1.6s}
.d5{animation-delay:1.95s}.d6{animation-delay:2.3s}.d7{animation-delay:2.65s}.d8{animation-delay:3s}.d9{animation-delay:3.35s}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fresh{animation:fresh 2.4s ease-out both}
@keyframes fresh{0%{background:#FFF1C2}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Home ---------- */
.hero{text-align:center;padding:26px 0 18px}
.hero svg{width:92px;height:69px}
.hero h2{margin:8px 0 2px;font-size:26px;color:var(--navy)}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px;margin:14px auto 22px}
.entry .card{padding:22px;text-align:left;border-width:1.5px}
.entry .card:hover{border-color:var(--blue)}
.entry .ic{font-size:28px}
.entry h3{margin:8px 0 4px;color:var(--navy);font-size:18px}
.entry.focus-a .a,.entry.focus-b .b{border-color:var(--blue);box-shadow:0 0 0 4px #D9E6FC}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}

/* ---------- Phase 1: chat + live panel ---------- */
.p1{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;height:calc(100vh - 280px);min-height:470px}
.chat{display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;color:var(--navy)}
.lock{font-size:12.5px;font-weight:600;color:var(--amber);background:var(--amber-l);padding:3px 10px;border-radius:999px}
.chat-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;max-width:88%}
.msg.dev{align-self:flex-end;flex-direction:row-reverse}
.msg .av{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue-l)}
.msg .av svg{width:24px;height:18px}
.msg.dev .av{background:#E9ECF2;color:#4B5468;font-weight:700;font-size:13px}
.bubble{padding:10px 14px;border-radius:12px;background:var(--canvas);border:1px solid var(--line)}
.msg.dev .bubble{background:var(--blue);color:#fff;border-color:var(--blue);border-top-right-radius:3px}
.msg.ai .bubble{border-top-left-radius:3px}
.q{display:block;font-weight:700;color:var(--navy);margin-top:4px}
.decide{margin-top:10px;border:1px solid #F2D199;background:var(--amber-l);border-radius:8px;padding:10px 12px}
.decide .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.fake-input{flex:1;border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:#9AA1B0;font-size:14px}
.send{width:42px;border:0;border-radius:6px;background:var(--blue);color:#fff}
.panel{overflow:auto;min-height:0;scroll-behavior:smooth}
.ph{position:sticky;top:0;background:var(--white);z-index:2;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pt{font-weight:700;color:var(--navy)}
.prog{margin-top:10px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.segs span{height:6px;border-radius:3px;background:#E6E9EF}
.segs span.on{background:var(--blue)}
.segs.warn span.on{background:#E3A23B}
.ptxt{font-size:12.5px;color:var(--muted);margin-top:4px}
.psec{padding:12px 16px;border-bottom:1px solid var(--line)}
.psec:last-child{border-bottom:0}
.psec h4{margin:0 0 6px;font-size:13px;color:var(--navy)}
.f{padding:4px 6px;margin:0 -6px;border-radius:6px}
.fl{font-size:12px;color:var(--muted);font-weight:600}
.fv{font-size:14px}
.fv.empty{color:#A8AFBC;font-style:italic;font-size:13px}
.yaml{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.45;margin:10px 0 0;white-space:pre;overflow:auto;color:var(--ink)}
.yaml .k{color:var(--blue-d)}

/* ---------- Discovery / gates / lanes / review ---------- */
.search-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.search-row:last-child{border-bottom:0}
.search-row .ic{font-size:20px;width:30px;text-align:center}
.search-row .grow{flex:1}
.ok{color:var(--green);font-weight:600;font-size:13px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;font-weight:600}
.banner.g{background:var(--green-l);color:var(--green);border:1px solid #BFE3CB}
.banner.a{background:var(--amber-l);color:var(--amber);border:1px solid #F2D199}
.banner.r{background:var(--red-l);color:var(--red);border:1px solid #F4C7C2}
.banner.b{background:var(--blue-l);color:var(--blue-d);border:1px solid #CADCF8}
.banner.v{background:var(--violet-l);color:var(--violet);border:1px solid #D4CEF5}
.banner .grow{flex:1;font-weight:500}
.find{padding:14px 16px}
.find .top-row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.find h4{margin:0;font-size:15px;color:var(--navy)}
.src{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:8px}
.conf{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.conf.h{background:var(--green-l);color:var(--green)}
.conf.m{background:var(--amber-l);color:var(--amber)}
.gate{padding:16px}
.gate h4{margin:0 0 8px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.gate li{display:flex;gap:8px;align-items:baseline}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.choice .card{padding:18px 20px;border-width:1.5px}
.choice .card.sel{border-color:var(--blue);box-shadow:0 0 0 4px #D9E6FC}
.choice h3{margin:4px 0;color:var(--navy);font-size:17px}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lane{border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.lane.maker{background:var(--blue-ll)}
.lane.checker{background:#F8F7FE}
.lh{display:flex;flex-direction:column;margin-bottom:12px}
.lh b{font-size:17px;color:var(--navy)}
.lh span{font-size:13px;color:var(--muted)}
.lane .card{padding:12px 14px;margin-bottom:10px}
.lane .card:last-child{margin-bottom:0}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.loop{margin-top:14px;text-align:center;padding:10px;border:1px dashed #B9C3D3;border-radius:8px;color:var(--muted);font-weight:600}
.code{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.codebox{background:#FBFCFE;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--white);font-size:13px}
pre.src-code{margin:0;padding:10px 0;font-family:var(--mono);font-size:12.6px;line-height:1.5;overflow:auto;max-height:calc(100vh - 330px)}
.ln{display:block;padding:0 14px 0 0;white-space:pre}
.ln i{display:inline-block;width:38px;text-align:right;margin-right:14px;color:#AAB1BE;font-style:normal;user-select:none}
.ln.todo{background:#FFF6E0}
.tk-k{color:#1757B8;font-weight:600}.tk-s{color:#157F3B}.tk-c{color:#8A6100;font-style:italic}.tk-b{color:#7A3FB8}
.score{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:0 0 108px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;background:var(--white)}
.tile b{display:block;font-size:24px;color:var(--navy);line-height:1.2}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad{border-color:#F4C7C2;background:var(--red-l)}.tile.bad b{color:var(--red)}
.tile.warn{border-color:#F2D199;background:var(--amber-l)}.tile.warn b{color:var(--amber)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#EEF0F4;margin:6px 0}
.bar i{display:block}
.explain{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;margin-top:10px}
.explain dt{font-weight:600;color:var(--muted);font-size:13px}
.explain dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:12px}
.seg span{padding:6px 12px;font-size:13px;border-right:1px solid var(--line);background:var(--white)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--green);color:#fff;font-weight:600}
.cmp td b{font-size:18px;color:var(--navy)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 26px}
.timeline li::before{content:"";position:absolute;left:6px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:-2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .tm{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:8px}
.prbox{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:12.8px;white-space:pre-wrap;line-height:1.5}
.drop{border:1.5px dashed #AFC5EC;border-radius:var(--radius);padding:22px;text-align:center;background:var(--blue-ll)}
.filechip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--white);border-radius:7px;padding:6px 10px;font-family:var(--mono);font-size:13px;margin:4px}

/* ---------- Cover / close ---------- */
.cover{min-height:calc(100vh - 170px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover svg{width:120px;height:90px}
.cover .wm{font-weight:800;letter-spacing:.08em;color:var(--navy);font-size:44px;margin-top:10px;line-height:1}
.cover .tagl{letter-spacing:.14em;color:var(--navy);font-weight:600;margin-top:8px;font-size:14px}
.cover h2{font-size:30px;color:var(--blue-d);margin:28px 0 8px;font-weight:700}
.cover p{color:var(--muted);max-width:60ch;margin:0 auto}
.principle{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.principle .card{padding:16px;text-align:left}
.principle .card b{display:block;color:var(--navy);font-size:16px;margin:6px 0 2px}
.paths{max-width:880px;margin:26px auto 0;text-align:left}
.pathrow{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pathrow:last-child{border-bottom:0}
.pathrow .seq{font-size:20px;letter-spacing:.1em}
.pathrow .seq small{font-size:12px;color:var(--muted);letter-spacing:0;margin-left:8px}

/* ---------- Presenter bar + notes ---------- */
.pbar{position:fixed;left:86px;right:0;bottom:0;height:58px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;z-index:20;backdrop-filter:blur(6px)}
.pbar .count{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:center}
.pbar select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--white);color:var(--ink)}
.pbar .sp{flex:1}
.pbar .hint{font-size:12px;color:#9AA1B0}
.pbar button:focus-visible,.pbar select:focus-visible{outline:3px solid #9CC0F7;outline-offset:2px}
.note{position:fixed;right:22px;bottom:72px;width:380px;background:var(--navy);color:#E9EEF8;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;z-index:30;box-shadow:0 10px 30px rgba(20,30,60,.25);display:none}
.note.show{display:block}
.note b{color:#fff}
.note .nt{font-size:12px;font-weight:700;color:#9EC1FA;margin-bottom:4px}

@media (max-width:1100px){.p1,.code,.lanes,.grid2,.choice,.entry{grid-template-columns:1fr}.p1{height:auto}.tiles{grid-template-columns:repeat(3,1fr)}.principle{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.stepper{overflow:auto}}
/* ---------- v2: single workspace ---------- */
.wsbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.wsbar .t{font-size:19px;font-weight:700;color:var(--navy);margin-right:10px}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 262px);min-height:460px;transition:grid-template-columns .35s ease}
.ws.exp{grid-template-columns:.7fr 1.6fr}
.wpanel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);padding:4px 8px 0;overflow-x:auto;flex:0 0 auto}
.tab{border:0;background:none;padding:10px 8px 8px;border-bottom:2.5px solid transparent;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;position:relative}
.tab.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.tab.lock{color:#C6CBD4;cursor:not-allowed}
.tab.new:not(.on)::after{content:"";position:absolute;top:8px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.tab:focus-visible,.expbtn:focus-visible{outline:3px solid #9CC0F7;outline-offset:-3px}
.expbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--ink);white-space:nowrap}
.tabbody{flex:1;overflow:auto;padding:14px 18px 18px;scroll-behavior:smooth}
.tabbody .psec{padding:10px 0}

const NOTES={
 overview:"<b>One look at the rulebook.</b> Six areas with a status, what needs attention, and health numbers that show where the AI or the requirements fall short. Switch between the last 30 days and all time.",
 charter:"<b>The short brief every AI call carries.</b> Purpose, scope and a glossary. The size meter keeps it short, because it goes into every prompt.",
 repo:"<b>Where the AI may write.</b> Allowed folders, the markers that prove a folder is a CodeVision copy, and what is never read. Changing it prompts a re-index.",
 caps:"<b>Every program belongs to a capability with a named senior and a backup.</b> That is who gets escalations in their Inbox. New programs a developer assigns wait in the Unassigned queue for Admin to confirm. Try the search, or Confirm a row.",
 ui:"<b>Aesthetic rules for CodeVision's own screens.</b> The bank brand team owns the official styles; the shared styles module carries them.",
 coding:"<b>Judgement rules the Tester checks, up to 10.</b> Plain-code rules are enforced by Layer A, and imports are checked against the approved libraries. Try approving the AI suggestion: it puts you in edit mode.",
 build:"<b>The limits behind every build.</b> Fix rounds, test time limit, files per request, and the <b>decision limit of 8</b>. Model per role. The 5 escalation triggers. Flag-for-review zones make a senior a required PR reviewer. Press <b>Edit</b>, change a value, then <b>Save as new version</b>.",
 history:"<b>Every save is a new version. Nothing is deleted.</b> Click a version to see exactly what changed. <b>Restore</b> creates a new version; requests already in progress stay on the version they started with."
};
let tab="overview";

function areaRows(r){
  const st=(c)=>`<span class="pill p-${c==="GREEN"?"green":"amber"}">${c}</span>`;
  const rows=[["charter","Project charter",`${r.charter.glossary.length} glossary terms; ${17+r.charter.glossary.length-3}% of the size limit`,"GREEN"],["repo","Repository and index",`${r.repo.allowed.length} allowed folders, ${r.repo.markers.length} workspace markers`,"GREEN"],["caps","Capability catalog",`${r.caps.length} capabilities, ${r.unassigned.length} Unassigned`,r.unassigned.length?"AMBER":"GREEN"],["ui","UI standards",`${r.ui.length} UI conventions`,"GREEN"],["coding","Coding standards",`${r.rules.length} judgement rules (of 10), ${r.libs.length} approved libraries`,"GREEN"],["build","Build and test",`max ${r.build.rounds} fix rounds, ${Object.values(r.build.trig).filter(x=>x).length} of 5 triggers on, ${r.zones.length} zones`,/trial/.test(r.build.tester)?"AMBER":"GREEN"]];
  return rows.map(x=>`<tr><td><a class="lnk" data-go="${x[0]}">${x[1]}</a></td><td class="small">${x[2]}</td><td>${st(x[3])}</td><td class="small muted">${lastChanged(x[0])}</td></tr>`).join("");
}
function lastChanged(area){const map={caps:"caps",build:"build"};for(let i=V.length-1;i>0;i--){const ch=diff(V[i-1].data,V[i].data).join(" ");if((area==="caps"&&/caps/.test(ch))||(area==="build"&&/build|Max|Decision|model|Trigger|Lock/.test(ch))||(area==="coding"&&/rules|libs/.test(ch))||(area==="charter"&&/charter/.test(ch))||(area==="repo"&&/repo/.test(ch))||(area==="ui"&&/ui/.test(ch)))return `changed in v${V[i].v}`;}return "not changed since v1";}
let win="30";
function overview(){
  const r=view();
  const H={"30":[["Requests","14","new 9, enhance 4, fix 1"],["First-round pass rate","64%","7 of 11 closed builds"],["Average fix rounds","0.9","per closed build"],["Requirement revisions","0.3","per request"],["Files edited by developers","18%","after the build"],["Escalations","3","Get help 2, Dispute 1"],["Handoffs","9","all passed the final check"]],"all":[["Requests","41","new 27, enhance 11, fix 3"],["First-round pass rate","58%","19 of 33 closed builds"],["Average fix rounds","1.1","per closed build"],["Requirement revisions","0.4","per request"],["Files edited by developers","22%","after the build"],["Escalations","9","Get help 4, Dispute 3, Cap hit twice 2"],["Handoffs","26","all passed the final check"]]}[win];
  const attn=[];
  r.caps.filter(c=>!c.backup).forEach(c=>attn.push(["AMBER",`${c.name} has no backup senior`,"caps"]));
  if(r.unassigned.length)attn.push(["AMBER",`${r.unassigned.length} programs waiting in the Unassigned queue`,"caps"]);
  if(/trial/.test(r.build.tester))attn.push(["INFO","Tester model is on trial: Llama vs Qwen side by side","build"]);
  return `<div class="card pad"><div class="h3">📚 Rulebook areas</div><table class="t"><tr><th>Area</th><th>Summary</th><th>Status</th><th>Last changed</th></tr>${areaRows(r)}</table></div>
  <div class="grid2 sect"><div class="card pad"><div class="h3">⚠️ Needs attention</div>${attn.length?attn.map(a=>`<div class="setrow"><span class="small"><span class="pill p-${a[0]==="INFO"?"blue":"amber"}">${a[0]}</span> ${a[1]}</span><a class="lnk small" data-go="${a[2]}">Open</a></div>`).join(""):'<p class="small muted">Nothing needs attention.</p>'}</div>
  <div class="card pad"><div class="h3" style="display:flex;justify-content:space-between;align-items:center">📈 Health numbers <span class="seg"><span data-win="30" class="${win==="30"?"on":""}">Last 30 days</span><span data-win="all" class="${win==="all"?"on":""}">All time</span></span></div>
  <div class="htiles">${H.map(h=>`<div class="tile"><b>${h[1]}</b><span>${h[0]}</span><div class="small muted">${h[2]}</div></div>`).join("")}</div></div></div>${ILLUS}`;
}
function charter(){
  const r=view(),c=r.charter;const size=17+c.glossary.length-3;
  return `<div class="grid2"><div class="card pad"><div class="h3">🎯 Purpose</div>${editing?`<textarea class="inp" data-k="charter.purpose" rows="3">${c.purpose}</textarea>`:`<p style="margin:0">${c.purpose}</p>`}<div class="fl" style="margin-top:10px">Who it is for</div><div class="fv">${c.audience}</div>
    <div class="fl" style="margin-top:10px">Size of the charter <span class="muted">(it goes into every AI prompt)</span></div><div class="meter"><span style="width:${size}%"></span></div><div class="small muted">${size}% of the size limit</div></div>
  <div class="card pad"><div class="h3">📐 Scope</div><div class="fl">In scope</div><ul class="clean small">${c.inScope.map(x=>`<li>✅ ${x}</li>`).join("")}</ul><div class="fl" style="margin-top:8px">Out of scope</div><ul class="clean small">${c.outScope.map(x=>`<li>🚫 ${x}</li>`).join("")}</ul></div></div>
  <div class="card pad sect"><div class="h3">📖 Glossary</div><table class="t"><tr><th>Term</th><th>Meaning</th></tr>${c.glossary.map(g=>`<tr><td><b>${g[0]}</b></td><td class="small">${g[1]}</td></tr>`).join("")}</table>${editing?`<div style="margin-top:10px;display:flex;gap:8px"><input class="inp" id="gTerm" placeholder="Term" style="max-width:180px"><input class="inp" id="gMean" placeholder="Meaning"><button class="btn" id="gAdd">Add term</button></div>`:""}</div>${ILLUS}`;
}
function repo(){
  const r=view().repo;
  return `<div class="grid2"><div class="card pad"><div class="h3">📂 Allowed folders <span class="muted small" style="font-weight:400">the AI may only write here</span></div><div class="chips">${r.allowed.map(x=>`<span class="chip mono">${x}</span>`).join("")}</div></div>
  <div class="card pad"><div class="h3">🧭 Workspace markers</div><p class="small muted" style="margin:0 0 8px">Folders that must exist, so the developer picked a real CodeVision copy.</p><div class="chips">${r.markers.map(x=>`<span class="chip mono">${x}</span>`).join("")}</div></div></div>
  <div class="grid2 sect"><div class="card pad"><div class="h3">🚫 Never read</div><div class="chips">${r.excluded.map(x=>`<span class="chip mono">${x}</span>`).join("")}</div>${editing?`<div style="margin-top:10px;display:flex;gap:8px"><input class="inp" id="exAdd" placeholder="Add an exclusion, e.g. scratch/"><button class="btn" id="exBtn">Add</button></div>`:""}</div>
  <div class="card pad"><div class="h3">🔎 Code index</div><p class="small" style="margin:0">${r.index}. Used by Discover to find code to reuse.</p><p class="small muted" style="margin:8px 0 0">Changing folders or exclusions asks for a full re-index after saving.</p></div></div>${ILLUS}`;
}
let q="";
function caps(){
  const r=view();const list=r.caps.filter(c=>!q||(c.name+c.senior+c.backup).toLowerCase().includes(q.toLowerCase()));
  const backups=["","Uploads deputy","Limits deputy","Remittance deputy","Collaterals deputy","Treasury deputy"];
  return `<div class="card pad"><div class="h3" style="display:flex;justify-content:space-between;align-items:center">🗂️ Capabilities <input class="inp" id="capq" placeholder="Search capability or senior" value="${q}" style="max-width:260px"></div>
  <table class="t"><tr><th>Capability</th><th>Named senior</th><th>Backup senior</th><th>Programs</th></tr>${list.map(c=>`<tr><td><b>${c.name}</b></td><td class="small">${c.senior}</td><td class="small">${editing?`<select class="inp" data-cap="${c.name}">${backups.map(b=>`<option ${b===c.backup?"selected":""} value="${b}">${b||"(none)"}</option>`).join("")}</select>`:(c.backup||'<span class="pill p-amber">Missing backup</span>')}</td><td class="small">${c.programs}</td></tr>`).join("")}</table>
  <p class="small muted" style="margin:8px 0 0">The named senior receives escalations for every program in the capability. The backup covers leave.</p></div>
  <div class="card pad sect"><div class="h3">📥 Unassigned queue <span class="muted small" style="font-weight:400">programs a developer assigned, waiting for Admin</span></div>
  ${r.unassigned.length?`<table class="t"><tr><th>Program</th><th>Picked by developer</th><th>By</th><th></th></tr>${r.unassigned.map((u,i)=>`<tr><td class="mono small">${u.path}</td><td class="small">${u.picked}</td><td class="small">${u.by}</td><td><button class="btn" data-confirm="${i}">Confirm</button></td></tr>`).join("")}</table>`:'<p class="small muted" style="margin:0">Queue is empty.</p>'}</div>${ILLUS}`;
}
function ui(){
  const r=view();
  return `<div class="card pad"><div class="h3">🎨 UI conventions</div><table class="t"><tr><th>ID</th><th>Rule</th></tr>${r.ui.map(u=>`<tr><td class="mono small">${u[0]}</td><td class="small">${u[1]}</td></tr>`).join("")}</table></div>
  <div class="grid2 sect"><div class="card pad"><div class="h3">🏷️ Who owns the styles</div><p class="small" style="margin:0">The <b>bank brand team</b> owns the official fonts and colours. CodeVision's shared styles module carries them, so new screens look like the rest of CodeVision.</p></div>
  <div class="card pad"><div class="h3">🔍 How it is checked</div><p class="small" style="margin:0">The Tester checks every new screen against these conventions (check 6, judgement rules), and cites the rule ID in any finding.</p></div></div>${ILLUS}`;
}
function coding(){
  const r=view();const suggested=!r.rules.some(x=>x[0]==="CV-PY-006");
  const sev=s=>`<span class="pill p-${s==="Must fix"?"red":s==="Should fix"?"amber":"blue"}">${s}</span>`;
  return `<div class="card pad"><div class="h3">⚖️ Judgement rules <span class="muted small" style="font-weight:400">${r.rules.length} of 10, checked by the Tester</span></div><table class="t"><tr><th>ID</th><th>Rule</th><th>Severity</th></tr>${r.rules.map(x=>`<tr><td class="mono small">${x[0]}</td><td class="small">${x[1]}</td><td>${sev(x[2])}</td></tr>`).join("")}</table>
  ${suggested?`<div class="sugg"><div><b>💡 AI suggestion</b> <span class="small muted">from 4 repeated Tester findings this month</span><div class="small">CV-PY-006: Dates are shown in Singapore time with the format DD Mon YYYY</div></div><button class="btn primary" id="approve">Approve rule</button></div>`:""}</div>
  <div class="card pad sect"><div class="h3">📦 Approved libraries <span class="muted small" style="font-weight:400">Layer A checks every import against this list</span></div><div class="chips">${r.libs.map(x=>`<span class="chip mono">${x}</span>`).join("")}</div></div>${ILLUS}`;
}
function build(){
  const b=view().build,r=view();
  const num=(k,v,min,max,lab,hint)=>`<div class="setrow"><span>${lab}<div class="small muted">${hint}</div></span>${editing?`<input type="number" class="inp num" data-k="build.${k}" value="${v}" min="${min}" max="${max}">`:`<span class="v">${v}</span>`}</div>`;
  const sel=(k,v,opts,lab)=>`<div class="setrow"><span>${lab}</span>${editing?`<select class="inp" data-k="build.${k}">${opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`:`<span class="v">${v}</span>`}</div>`;
  const tg=(k,on,lab)=>`<div class="setrow"><span class="small">${lab}</span><span class="tgl ${on?"on":""} ${editing?"ed":""}" data-t="${k}"></span></div>`;
  return `<div class="adm">
  <div class="card pad"><div class="h3">⚙️ Limits</div>${num("rounds",b.rounds,1,5,"Max fix rounds per build","Allowed 1 to 5")}${num("timeLimit",b.timeLimit,1,600,"Test time limit (seconds)","Per sandbox run, 1 to 600")}${num("maxFiles",b.maxFiles,1,20,"Max files per request","Above this, a split is suggested")}${num("decisionLimit",b.decisionLimit,1,15,"Decision limit in Understand","Then: proceed with assumptions, or send to my senior")}</div>
  <div class="card pad"><div class="h3">🤖 Model per role</div>${sel("gen",b.gen,["Qwen3.6-35B-A3B","Llama-4-Maverick"],"Generator (writes the code)")}${sel("tester",b.tester,["Llama-4-Maverick (trial)","Qwen3.6-35B-A3B","Llama-4-Maverick"],"Tester (checks the work)")}<p class="small muted" style="margin:8px 0 0">Bank-hosted models only. The Tester is chosen by a side-by-side trial.</p></div>
  <div class="card pad"><div class="h3">🆘 Escalation triggers <span class="muted small" style="font-weight:400">fixed list, on or off</span></div>${tg("cap",b.trig.cap,"Fix-round cap hit twice in a row")}${tg("scope",b.trig.scope,"Request or approach out of scope")}${tg("dispute",b.trig.dispute,"Developer disputes a Tester finding")}${tg("unable",b.trig.unable,"Tester unable to assess twice")}${tg("help",b.trig.help,"Developer presses Get help")}${tg("lockChat",b.lockChat,"Lock the developer's chat during an escalation")}<p class="small muted" style="margin:8px 0 0">Escalations go to the capability senior's Inbox inside CodeVision.</p></div>
  <div class="card pad"><div class="h3">🚩 Flag-for-review zones</div>${r.zones.map(z=>`<div class="zonecard"><b>${z[0]}</b> <span class="small muted">${z[1]}</span><div class="mono small muted">${z[2]}</div></div>`).join("")}<p class="small muted" style="margin:0">Effect: the named senior becomes a <b>required PR reviewer</b>. Not a block. Security and login code is never assumed.</p></div>
  <div class="card pad"><div class="h3">🔒 Protected files</div><div class="chips">${r.protected.map(x=>`<span class="chip mono">${x}</span>`).join("")}</div><p class="small muted" style="margin:8px 0 0">The AI may never write these. Needing one is flagged in Approach.</p></div>
  <div class="card pad"><div class="h3">🧪 Tests</div><ul class="clean small"><li>✅ Requirement tests from the criteria, frozen before the code</li><li>✅ Code tests after the build, for branches and edge cases</li><li>✅ Tests run only in the server sandbox, never in the developer's folder</li><li>✅ A test with no result counts as Not proven and blocks the pass</li></ul></div>
  </div>${ILLUS}`;
}
function history(){
  const list=[...V].reverse();
  const s=V[sel-1];const prev=sel>1?V[sel-2]:null;
  const pinned={1:2,2:3,3:4,4:6,5:9};
  return `<div class="vgrid"><div class="card pad"><div class="h3">🕘 Versions</div>${list.map(v=>`<div class="vrow ${v.v===sel?"sel":""}" data-v="${v.v}"><div class="vtop"><span class="vname">v${v.v}</span><span class="tags">${v.v===active?'<span class="pill p-green">ACTIVE</span>':""}${v.from?`<span class="pill p-violet">RESTORED FROM v${v.from}</span>`:""}</span></div><div class="small">${v.note}</div><div class="small muted">${v.by} · ${v.at}</div></div>`).join("")}</div>
  <div class="card pad"><div class="h3">🔍 v${s.v}: what changed${prev?` since v${prev.v}`:""}</div><ul class="clean">${(s.changes.length?s.changes:["No changes"]).map(c=>`<li class="chg">${c}</li>`).join("")}</ul>
    <div class="setrow" style="margin-top:10px"><span class="small">Requests pinned to this version</span><span class="v">${pinned[s.v]??0}</span></div>
    <p class="small muted">A request keeps the rulebook version it started with, like a job that keeps the library list it started with.</p>
    ${s.v!==active?`<button class="btn primary" id="restore">Restore v${s.v} as a new version</button>`:'<span class="small muted">This is the active version.</span>'}</div></div>${ILLUS}`;
}
const RENDER={overview,charter,repo,caps,ui,coding,build,history};

/* ================= Shell ================= */
function paint(){
  const a=V[active-1];
  $("verline").innerHTML=`Showing <b>v${active}</b> (active), saved by ${a.by} on ${a.at}: ${a.note}`;
  $("actions").innerHTML=tab==="overview"||tab==="history"?"":(editing?"":`<button class="btn" id="editBtn">✏️ Edit</button>`);
  $("atabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tab?"on":""}" data-tab="${k}">${l}</button>`).join("");
  $("screen").innerHTML=RENDER[tab]();
  $("count").textContent=`${TABS.findIndex(t=>t[0]===tab)+1} / ${TABS.length}`;
  $("note").innerHTML=`<div class="nt">💡 WHAT THIS SHOWS</div>${NOTES[tab]}`;
  $("editbar").classList.toggle("show",editing);
  $("ebName").textContent=TABS.find(t=>t[0]===tab)[1];
  bind();
}
function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>goTab(b.dataset.go));
  document.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{win=b.dataset.win;paint();});
  const e=$("editBtn");if(e)e.onclick=startEdit;
  document.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{setK(i.dataset.k,i.type==="number"?Number(i.value):i.value);});
  document.querySelectorAll(".tgl.ed").forEach(t=>t.onclick=()=>{const k=t.dataset.t;if(k==="lockChat")draft.build.lockChat=!draft.build.lockChat;else draft.build.trig[k]=!draft.build.trig[k];paint();});
  document.querySelectorAll("[data-cap]").forEach(s=>s.onchange=()=>{draft.caps.find(c=>c.name===s.dataset.cap).backup=s.value;});
  const cq=$("capq");if(cq){cq.oninput=()=>{q=cq.value;const pos=cq.selectionStart;paint();const n=$("capq");n.focus();n.setSelectionRange(pos,pos);};}
  document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{if(!editing)startEdit();draft.unassigned.splice(Number(b.dataset.confirm),1);paint();toast("Confirmed. Save as a new version to publish it.");});
  const ap=$("approve");if(ap)ap.onclick=()=>{if(!editing)startEdit();draft.rules.push(["CV-PY-006","Dates are shown in Singapore time with the format DD Mon YYYY","Should fix"]);paint();};
  const ga=$("gAdd");if(ga)ga.onclick=()=>{const t=$("gTerm").value.trim(),m=$("gMean").value.trim();if(t&&m){draft.charter.glossary.push([t,m]);paint();}};
  const ex=$("exBtn");if(ex)ex.onclick=()=>{const v=$("exAdd").value.trim();if(v){draft.repo.excluded.push(v);paint();}};
  document.querySelectorAll("[data-v]").forEach(r=>r.onclick=()=>{sel=Number(r.dataset.v);paint();});
  const rs=$("restore");if(rs)rs.onclick=()=>modal(`Restore v${sel}?`,`<p class="small">This creates <b>v${V.length+1}</b> with the same rules as v${sel}. Nothing is deleted. Requests in progress stay on their version.</p>`,"Restore",()=>{const src=V[sel-1];addV(src.data,"Chris Ong",nowStr(),`Restored from v${sel}`,diff(cur(),src.data).length?diff(cur(),src.data):["No differences"],sel);active=V.length;sel=active;paint();toast(`Restored. v${active} is now active.`);});
}
function setK(k,v){const p=k.split(".");let o=draft;while(p.length>1)o=o[p.shift()];o[p[0]]=v;}
function startEdit(){draft=clone(cur());editing=true;paint();}
$("ebCancel").onclick=()=>{editing=false;draft=null;paint();};
$("ebSave").onclick=()=>{
  const ch=diff(cur(),draft);
  if(!ch.length){toast("Nothing changed yet.");return;}
  modal("Save as a new version",`<p class="small" style="margin:0 0 6px">Changes:</p><ul class="clean small">${ch.map(c=>`<li class="chg">${c}</li>`).join("")}</ul><label class="small" style="display:block;margin-top:10px;font-weight:600">Change note (required)</label><input class="inp" id="cnote" placeholder="Why this change?">`,"Save",()=>{
    const n=$("cnote").value.trim();if(!n){$("cnote").classList.add("err");return false;}
    addV(draft,"Chris Ong",nowStr(),n,ch);active=V.length;sel=active;editing=false;draft=null;paint();toast(`Saved as v${active}. New requests use it; requests in progress stay on their version.`);});
};
function nowStr(){const d=new Date();return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toTimeString().slice(0,5);}
function modal(title,body,ok,fn){
  $("mbox").innerHTML=`<div class="mhead"><b>${title}</b></div>${body}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn primary" id="mOk">${ok}</button></div>`;
  $("mscrim").classList.add("show");
  $("mCancel").onclick=()=>$("mscrim").classList.remove("show");
  $("mOk").onclick=()=>{if(fn()!==false)$("mscrim").classList.remove("show");};
  const i=$("cnote");if(i)i.focus();
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3200);}
function goTab(k){if(editing&&k!==tab){toast("Save or cancel your edit first.");return;}tab=k;window.scrollTo(0,0);paint();}
$("next").onclick=()=>{const i=TABS.findIndex(t=>t[0]===tab);if(i<TABS.length-1)goTab(TABS[i+1][0]);};
$("back").onclick=()=>{const i=TABS.findIndex(t=>t[0]===tab);if(i>0)goTab(TABS[i-1][0]);};
$("notesBtn").onclick=()=>{const on=$("note").classList.toggle("show");$("notesBtn").setAttribute("aria-pressed",on);};
document.addEventListener("keydown",e=>{if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName))return;if(e.key==="ArrowRight")$("next").click();else if(e.key==="ArrowLeft")$("back").click();else if(e.key==="n"||e.key==="N")$("notesBtn").click();});
paint();
})();
</script>
</body>
</html>
